<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChessLens AI | Smart Board Scanner</title>
    <!-- Tailwind CSS (for modern UI styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jQuery (dependency for chessboard.js) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Chessboard.js CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <!-- Chess.js (for game rules and FEN validation) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <style>
        /* Smooth shadow and rounded corners for chessboard */
        .chessboard-container {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Top Header -->
    <header class="border-b border-slate-800 bg-slate-900/70 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">♟️</span>
                <span class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
                    ChessLens AI
                </span>
                <span class="text-xs px-2.5 py-0.5 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20 font-medium">
                    Vision Scanner
                </span>
            </div>
            <!-- Hidden Settings Gear (Only you click this to configure) -->
            <button id="btnOpenSettings" title="Configure AI Settings" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition flex items-center gap-1.5 text-xs">
                <span>⚙️</span>
                <span id="keyIndicator" class="w-2 h-2 rounded-full bg-rose-500"></span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Left: Interactive Chessboard (7 cols) -->
        <div class="lg:col-span-7 flex flex-col items-center">
            <div class="w-full max-w-[500px]">
                <div id="board" class="w-full chessboard-container aspect-square mb-4 bg-slate-800"></div>
                <!-- Quick Action Toolbar -->
                <div class="flex items-center justify-between gap-2 bg-slate-900 p-3 rounded-xl border border-slate-800 text-sm">
                    <button id="btnFlip" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition">
                        🔄 Flip Board
                    </button>
                    <button id="btnStart" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition">
                        ⏮️ Reset Position
                    </button>
                    <button id="btnClear" class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-rose-400 transition">
                        🗑️ Clear Board
                    </button>
                </div>
            </div>
        </div>

        <!-- Right: Recognition & Export Controls (5 cols) -->
        <div class="lg:col-span-5 space-y-6">

            <!-- Step 1: Capture or Upload Image -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                <div class="flex items-center justify-between mb-3">
                    <h2 class="text-base font-semibold flex items-center gap-2">
                        <span>📸</span> Step 1: Take Photo or Upload
                    </h2>
                    <span class="text-xs text-blue-400 font-mono">Vision AI</span>
                </div>
                <!-- Upload Area -->
                <div id="uploadTrigger" class="border-2 border-dashed border-slate-700 hover:border-blue-500/60 rounded-xl p-4 text-center cursor-pointer transition bg-slate-950/40 group">
                    <input type="file" id="imageInput" accept="image/*" capture="environment" class="hidden">
                    <div id="uploadPrompt" class="space-y-1">
                        <div class="text-3xl text-slate-500 group-hover:text-blue-400 transition">📷</div>
                        <p class="text-sm font-medium text-slate-300">Click to Snap or Upload Board</p>
                        <p class="text-xs text-slate-500">Supports phone photos, diagrams & screenshots</p>
                    </div>
                    <!-- Image Preview -->
                    <img id="imagePreview" class="hidden max-h-48 mx-auto rounded-lg object-contain shadow mt-2">
                </div>
                <!-- Recognition Action Button -->
                <button id="btnRunAI" class="w-full mt-3 py-2.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl font-medium text-sm transition shadow-lg shadow-blue-500/20 disabled:opacity-50" disabled>
                    ⚡ Recognize Pieces & Calculate FEN
                </button>
                <div id="aiStatus" class="text-xs text-slate-400 mt-2 text-center hidden"></div>
            </div>

            <!-- Step 2: FEN Code & Position Review -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                <h2 class="text-base font-semibold flex items-center gap-2 mb-3">
                    <span>📝</span> Step 2: FEN Position
                </h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Current FEN String</label>
                        <textarea id="fenInput" rows="2" class="w-full bg-slate-950 border border-slate-700 focus:border-blue-500 rounded-xl p-2.5 text-xs font-mono text-slate-200 outline-none resize-none transition" placeholder="FEN will appear here..."></textarea>
                    </div>
                    <div id="fenValidationMsg" class="text-xs font-mono"></div>
                    <div class="flex gap-2">
                        <button id="btnUpdateFromFen" class="flex-1 py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-medium transition">
                            Apply FEN to Board
                        </button>
                        <button id="btnCopyFen" class="py-2 px-3 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs transition">
                            📋 Copy FEN
                        </button>
                    </div>
                </di
